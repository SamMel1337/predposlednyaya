{% extends 'mailing/base.html' %}

{% block title %}Удаление клиента - Mailing Service{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title mb-0">Удаление клиента</h2>
            </div>
            <div class="card-body">
                <p>Вы уверены, что хотите удалить клиента <strong>{{ object.email }}</strong>?</p>
                <p class="text-muted">Это действие нельзя будет отменить.</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">Удалить</button>
                        <a href="{% url 'client_list' %}" class="btn btn-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
